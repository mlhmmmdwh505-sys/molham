<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07131e">
    <meta name="copyright" content="Copyright © 2026 Molham Mamdouh. Original website materials reserved.">
    <title>Pong | ملهم</title>
    <link rel="stylesheet" href="fonts.css?v=1">
    <link rel="stylesheet" href="pong.css?v=3">
</head>
<body>
    <main class="game-shell">
        <header class="game-heading">
            <div>
                <span class="game-kicker" id="gameKicker">استراحة قصيرة</span>
                <h1>PONG</h1>
            </div>
            <span class="offline-badge" id="offlineBadge">تعمل دون إنترنت</span>
        </header>
        <div class="game-controls">
            <label class="difficulty-control" for="difficultySelect">
                <span id="difficultyLabel">المستوى</span>
                <select id="difficultySelect" aria-label="مستوى صعوبة اللعبة">
                    <option value="easy">سهل</option>
                    <option value="medium" selected>متوسط</option>
                    <option value="hard">صعب</option>
                </select>
            </label>
        </div>
        <div class="canvas-wrap">
            <canvas id="pongCanvas" width="960" height="540" tabindex="0" aria-label="لعبة بونج"></canvas>
            <button id="startButton" class="start-button" type="button">ابدأ اللعب</button>
        </div>
        <footer class="game-footer">
            <span id="gameHelp">حرّك المضرب بالماوس أو بالأسهم ↑ ↓ أو W و S</span>
            <span id="scoreLabel">أول لاعب يصل إلى ٥ نقاط يفوز</span>
        </footer>
    </main>
    <script src="pong.js?v=2" defer></script>
</body>
</html>
