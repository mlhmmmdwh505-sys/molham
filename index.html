<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="stylesheet" href="style.css?v=5">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
    <meta name="google-site-verification" content="zTFBE1PBvuWcR2F9TmV3Y5NEpOiBw5Ehu0gFfzFi2Y0" />
    <meta property="og:site_name" content="D.MOLHAM Surgeon Dashboard">
    <meta name="keywords" content="ملهم ممدوح, molham, github pages, موقع ملهم">
    <meta name="description" content="هذا الموقع جميل و مثالي للدراسة و العمل و جميع المهام موقع ملهم هو اداة تنظيم و ترتيب و زيادة الانتاجية مصمم من قبل ملهم.">
    <meta name="verifywebsiteownership" content="tgf8hWSVWpGMEXVmzfc2SXcru"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surgeon Dashboard D.MOLHAM MMDOH ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glass-card">
        <div class="mini-score">
            <span>🪙 <span id="userPoints">0</span></span>
            <button onclick="resetPoints()" class="reset-mini" title="تصفير النقاط">🗑️</button>
        </div>

        <div class="date-tag" id="dateDisplay"></div>

        <header>
            <h1 id="mainTitle">لوحة تحكم <span id="mainTitleName">دكتور ملهم</span> 🩺</h1>
            <p class="welcome-msg"><span id="welcomeWord">مرحباً بك،</span> <span id="userNameDisplay">دكتور ملهم</span> ✨</p>
            <p id="motivationQuote" style="color: var(--primary); font-style: italic; margin-top: 10px; min-height: 24px; font-weight: bold;"></p>
            
            <div class="settings-bar card">
                <div class="setting-item">
                    <label id="langLabel">اللغة</label>
                   <select id="languageSelect" class="form-control">
    <option value="ar">العربية</option>
    <option value="en">English</option>
</select>
                </div>
                <div class="setting-item">
                    <label id="nameLabel">الاسم</label>
                    <input type="text" id="userNameInput" placeholder="اكتب اسمك هنا...">
                </div>
                <div class="setting-item">
                    <label id="colorLabel">اللون</label>
                    <input type="color" id="colorPicker" value="#6366f1">
                </div>
                <div class="setting-item">
                    <label id="dateLabel">التاريخ</label>
                    <input type="date" id="gradDateInput">
                </div>
                <div class="setting-item">
                    <label id="minsLabel">الدقائق</label>
                    <input type="number" id="minsInput" value="25" class="num-input">
                </div>
                <button class="btn-save" id="mainSaveBtn">تأكيد الإعدادات</button>
            </div>
        </header>

        <div class="dashboard-grid">
            <aside class="side-col">
                <section class="info-card">
                    <h3 id="countdownTitle">⏳ حلم التخرج</h3>
                    <div id="countdown" class="modern-timer">
                        <div class="unit"><span id="years">00</span><label id="labelYears">سنة</label></div>
                        <div class="unit"><span id="days">00</span><label id="labelDays">يوم</label></div>
                        <div class="unit"><span id="hours">00</span><label id="labelHours">ساعة</label></div>
                    </div>
                </section>

                <section class="info-card store-card">
                    <h3 id="storeTitle">☕ متجر الطاقة 1د = 15ن</h3>
                    <div class="store-grid">
                        <div class="item" onclick="buyBreak(5)" id="itemBreak5">5 د = <small>75ن</small></div>
                        <div class="item" onclick="buyBreak(10)" id="itemBreak10">10 د = <small>150ن</small></div>
                        <div class="item" onclick="buyBreak(15)" id="itemBreak15">15 د = <small>225ن</small></div>
                    </div>
                </section>
            </aside>

            <main class="main-col">
                <section class="info-card focus-card">
                    <div id="pomoDisplay">25:00</div>
                    <div class="pomo-actions">
                        <button onclick="toggleTimer()" id="startBtn" class="btn-main">ابدأ المهمة</button>
                        <button onclick="resetTimer()" id="resetBtn">اعادة ضبط</button>
                    </div>
                </section>

                <section class="info-card tasks-card">
                    <div class="input-section">
                        <input type="text" id="taskInput" placeholder="أضف مهمة جديدة...">
                        <button onclick="addTask()" class="btn-add">+</button>
                    </div>
                    <ul id="taskList" class="custom-scroll"></ul>
                </section>
            </main>
        </div>
    </div>
    
    <audio id="alarmSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>
  <script src="script.js?v=10"></script>
    <script>
document.addEventListener("DOMContentLoaded", function() {
    // 1. تحديد العناصر من الصفحة
    var langSelect = document.getElementById('languageSelect');
    var saveBtn = document.getElementById('saveSettingsBtn') || document.querySelector('.settings-box button') || document.querySelector('button[onclick*="save"]');

    if (langSelect) {
        // فك أي ارتباط أو حدث قديم بيغير اللغة تلقائياً بمجرد الاختيار
        var clonedSelect = langSelect.cloneNode(true);
        langSelect.parentNode.replaceChild(clonedSelect, langSelect);
        langSelect = clonedSelect; 

        // إنشاء متغير مؤقت لحفظ لغة الاختيار في ذاكرة المتصفح المؤقتة فقط
        var tempLang = localStorage.getItem('selectedLanguage') || 'ar';
        langSelect.value = tempLang;

        // عند تغيير الاختيار، نحفظه في المتغير المؤقت بدون أي تأثير على الكروت أو الصفحة
        langSelect.addEventListener('change', function(e) {
            tempLang = e.target.value;
        });

        // 2. ربط زر التأكيد بشكل قاطع
        if (saveBtn) {
            saveBtn.addEventListener('click', function(e) {
                // منع أي دالة قديمة مسببة للمشاكل من العمل
                e.preventDefault();
                e.stopPropagation();

                // الحفظ الرسمي للغة الجديدة الآن فقط عند الضغط
                localStorage.setItem('selectedLanguage', tempLang);
                
                // تطبيق الاتجاه
                document.documentElement.lang = tempLang;
                document.documentElement.dir = tempLang === 'ar' ? 'rtl' : 'ltr';

                // إعادة تحميل الصفحة نظيفة تماماً بالتعديل الجديد
                location.reload();
            });
        }
    }
});
</script>
</body>
</html>
